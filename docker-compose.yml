version: '3.8'
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: mi_postgres_api
    environment:
      POSTGRES_DB: examen
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
